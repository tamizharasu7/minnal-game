<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MINNAL: The Game</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1c;--fg:#f2efe6;--acc:#ff4122;--gold:#ffc83d;--pan:#1a2244;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#stage{position:relative;width:min(100vw,56.25vh);height:min(177.7vw,100vh);container-type:size;background:#0b0f1c;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#reveal{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#050505}
#reveal img{width:100%;height:100%;object-fit:contain}
#reveal .tag{position:absolute;left:7%;right:7%;bottom:9%;padding:4cqw 3cqw;border:2px solid #ffc83d;border-radius:2cqw;background:rgba(5,8,16,.88);color:#ffc83d;font:7cqw Anton,Impact,sans-serif;text-align:center;text-shadow:0 2px 5px #000}
#upgrade{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;padding:7cqw;background:rgba(5,8,16,.96);text-align:center}
#upgrade img{width:82%;height:68%;object-fit:contain}
#upgrade .tag{padding:3cqw;border:2px solid #ffc83d;border-radius:2cqw;background:#10172ddd;color:#ffc83d;font:6cqw Anton,Impact,sans-serif}
#upgrade p{margin:0;color:#c9cde0;font-size:4cqw}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;padding:8cqw;text-align:center;background:rgba(8,10,20,.86)}
[hidden]{display:none!important}
.logo{font:15cqw/1 Anton,Impact,sans-serif;letter-spacing:.5cqw;color:var(--fg);text-shadow:0 0 6cqw #ff4122}
.sub{font:5cqw Anton,Impact,sans-serif;letter-spacing:2cqw;color:var(--gold);margin-top:-2cqw}
.ov p{font-size:4.4cqw;line-height:1.5;color:#c9cde0;margin:2cqw 0}
.btn{width:100%;padding:4cqw;border:2px solid #34407a;border-radius:2cqw;background:var(--pan);color:var(--fg);font:6cqw Anton,Impact,sans-serif;letter-spacing:1cqw}
.btn.pri{background:linear-gradient(#ff4a26,#c32a10);border-color:#ff7a5a;box-shadow:0 1.2cqw 0 #7e1a08}
#mute{position:absolute;top:2cqw;right:2cqw;width:11cqw;height:11cqw;border-radius:50%;border:2px solid #34407a;background:var(--pan);font-size:5cqw;color:var(--fg)}
#ctl button{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(30,40,90,.5);color:var(--fg);font:3.4cqw Rajdhani,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
#ctl button span{font-size:7cqw}
#ctl button.on{background:rgba(255,65,34,.55);transform:scale(.94)}
</style></head><body>
<div id="wrap"><div id="stage"><canvas id="c"></canvas>
<div class="ov" id="menu"><div class="logo">MINNAL</div><div class="sub">THE GAME</div>
<p>Transformer-la fuse carrier-a yaaro thookitanga. Oor muzhukka power cut. Minnal oruthan than current-a thirumba kondu varuvaan.</p>
<button class="btn pri" onclick="start('story')">STORY MODE</button>
<button class="btn" onclick="start('wave')">WAVE MODE</button>
<button class="btn" onclick="start('swing')">SWING MODE</button>
<button class="btn" onclick="start('cross')">CROSS MODE</button></div>
<div class="ov" id="end" hidden><div class="logo" id="et" style="font-size:12cqw"></div><p id="es"></p>
<button class="btn pri" id="er" onclick="start(mode)"></button><button class="btn" onclick="menu()">MAIN MENU</button></div>
<button id="mute">🔊</button>
<div id="ctl" hidden>
<button data-k="left" style="left:3cqw;bottom:8cqw;width:21cqw;height:21cqw"><span>◀</span></button>
<button data-k="right" style="left:26cqw;bottom:8cqw;width:21cqw;height:21cqw"><span>▶</span></button>
<button data-k="punch" style="right:4cqw;bottom:8cqw;width:23cqw;height:23cqw"><span>👊</span>PUNCH</button>
<button data-k="kick" style="right:29cqw;bottom:12cqw;width:20cqw;height:20cqw"><span>🦵</span>KICK</button>
<button data-k="gun" style="right:6cqw;bottom:34cqw;width:20cqw;height:20cqw"><span>🔫</span>SHOOT</button>
<button data-k="jump" style="right:30cqw;bottom:35cqw;width:19cqw;height:19cqw"><span>⤒</span>JUMP</button>
</div>
<div id="reveal" hidden role="status"><img src="images/villain_reveal.jpg" alt="A masked villain seated in a chair"><div class="tag">finally its my time</div></div>
<div id="upgrade" hidden role="status"><img src="images/hero-upgrade/power-shot.png" alt="Minnal firing his upgraded heavy gun"><div class="tag">HEAVY GUN UPGRADE</div><p>POWER SHOTS READY FOR THE FINAL FIGHT</p></div>
</div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d');
const W=360,H=640,GY=440,WW=720,S=1.3;cv.width=W*2;cv.height=H*2;
let mode='story',state='menu',cam=0,shake=0,hs=0,time=0,mute=false;
let p,es=[],bs=[],pk=[],pt=[],tx=[],queue=[],wave=1,score=0,combo=0,comboT=0,kills=0,koT=0,phase='intro',phaseT=0,spawnT=0;
const keys={},press={};
const DEF={r:{hp:30,sp:75,d:7,rg:50,w:.35,cd:1,sc:1,shirt:'#a3202a',pants:'#1a1a22',skin:'#b97a50',hair:'#1a1008',pts:100},
h:{hp:85,sp:45,d:15,rg:58,w:.6,cd:1.6,sc:1.2,shirt:'#5b2a8c',pants:'#22202c',skin:'#a86b45',hair:'#111',pts:250},
g:{hp:26,sp:55,d:9,rg:0,w:.55,cd:2.1,sc:1,shirt:'#1f7a52',pants:'#1c2420',skin:'#c58c60',hair:'#222',rng:1,pts:150},
v:{hp:150,sp:58,d:16,rg:72,w:.45,cd:1.25,sc:1.2,shirt:'#168b9e',pants:'#10242b',skin:'#8d684f',hair:'#07171b',pts:500},
b:{hp:280,sp:62,d:18,rg:66,w:.45,cd:1.1,sc:1.4,shirt:'#c9a227',pants:'#2a2218',skin:'#9c6240',hair:'#000',pts:1500},
x:{hp:420,sp:58,d:20,rg:104,w:.72,cd:1.35,sc:1.55,shirt:'#17191e',pants:'#101116',skin:'#ddd',hair:'#111',pts:5000}};
const HERO={sc:1,shirt:'#15171f',pants:'#0d0e14',skin:'#c68a5a',hair:'#0a0a0a',hero:1};
const CROSS_PLATFORMS=[
{x:0,y:365,w:172},{x:250,y:405,w:112},{x:430,y:350,w:104},
{x:600,y:390,w:122},{x:808,y:332,w:102},{x:978,y:382,w:116},
{x:1168,y:342,w:104},{x:1340,y:405,w:126},{x:1550,y:350,w:110},
{x:1735,y:390,w:140},{x:1950,y:350,w:230}
];
const CROSS_GOAL=2120,CROSS_GRAVITY=1550,CROSS_JUMP=-650;
// ---------- audio
let ac;function snd(f,d,ty='square',v=.07,sl=0){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}
$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊'};
// ---------- input
const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'punch',KeyK:'kick',KeyL:'gun'};
addEventListener('keydown',e=>{const k=map[e.code];if(k){if(phase!=='reveal'&&phase!=='upgrade'){if(!keys[k])press[k]=true;keys[k]=true}e.preventDefault()}});
addEventListener('keyup',e=>{const k=map[e.code];if(k)keys[k]=false});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(phase!=='reveal'&&phase!=='upgrade'){keys[k]=true;press[k]=true;b.classList.add('on')}});
const up=()=>{keys[k]=false;b.classList.remove('on')};['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,up))});
// ---------- flow
function menu(){state='menu';$('menu').hidden=false;$('end').hidden=true;$('ctl').hidden=true}
function start(m){mode=m;cam=0;shake=0;hs=0;p={x:180,y:GY,vy:0,vx:0,face:1,hp:100,ammo:6,ammoMax:6,upgraded:false,atk:null,stun:0,inv:0,kv:0,dead:false,dt:0,anim:0,moving:false,flash:0,hero:1,onBuilding:false,swingPose:'swing'};
if(m==='swing'){p.y=GY-210;p.vx=205;p.swingAnchor=nextSwingAnchor(p.x);p.swingRope=Math.max(175,Math.min(300,Math.hypot(p.x-p.swingAnchor.x,p.y-SWING_HOOK_Y-p.swingAnchor.y)));p.swingDistance=0;p.swingArmed=false}
if(m==='cross'){p.x=65;p.y=CROSS_PLATFORMS[0].y;p.vx=0;p.vy=0;p.onGround=true}
es=[];bs=[];pk=[];pt=[];tx=[];queue=[];wave=1;score=0;combo=0;comboT=0;kills=0;koT=0;phase=m==='swing'?'swing':m==='cross'?'cross':'intro';phaseT=m==='swing'||m==='cross'?0:1.8;spawnT=0;
for(const k in keys)keys[k]=false;for(const k in press)press[k]=false;
$('ctl').querySelector('[data-k="jump"]').innerHTML=m==='swing'?'<span>⤒</span>HOLD SWING':'<span>⤒</span>JUMP';
$('ctl').querySelector('[data-k="punch"]').innerHTML=m==='swing'?'<span>⚡</span>BOOST':'<span>👊</span>PUNCH';
$('ctl').querySelector('[data-k="punch"]').hidden=m==='cross';
$('ctl').querySelector('[data-k="kick"]').hidden=m==='swing'||m==='cross';$('ctl').querySelector('[data-k="gun"]').hidden=m==='swing'||m==='cross';
$('ctl').querySelector('[data-k="punch"]').style.right=m==='swing'?'8cqw':'4cqw';
$('menu').hidden=true;$('end').hidden=true;$('ctl').hidden=false;state='play';snd(300,.3,'sawtooth',.08,400)}
function end(win){state='end';$('ctl').hidden=true;$('end').hidden=false;let b=0;const key='minnal_'+mode;
try{b=+localStorage.getItem(key)||0;if(score>b){b=score;localStorage.setItem(key,b)}}catch(e){b=Math.max(b,score)}
$('es').innerHTML=mode==='swing'?'Distance covered: '+score+' m<br>Best '+b:mode==='cross'?(win?'You reached the goal!':'You fell between platforms.')+'<br>Distance '+score+' m<br>Best '+b:(win?'Oor-la light vandhuduchu!':'The street wins this round…')+'<br>Mode: '+(mode==='story'?'Story':'Wave')+' · Wave '+wave+'<br>Score '+score+'<br>Best '+b;
$('et').textContent=mode==='swing'?'SWING OVER':mode==='cross'?(win?'CROSS COMPLETE':'CROSS FAILED'):win?'POWER RESTORED':'KNOCKED OUT';
$('er').textContent=mode==='story'?'RETRY STORY':mode==='swing'?'RETRY SWING MODE':mode==='cross'?'RETRY CROSS MODE':'RETRY WAVE MODE'}
function buildQ(){queue=[];if(wave===5||(mode==='wave'&&wave%5===0)){queue=['x'];return}
const n=Math.min(14,3+wave*2-(wave===3||wave===4?4:0));for(let i=0;i<n;i++){const r=Math.random();queue.push(wave>1&&r<Math.min(.28,.07*wave)?'g':wave>1&&r<Math.min(.55,.07*wave+.08*wave)?'h':'r')}
if(wave===3)queue.splice(Math.floor(queue.length/2),0,'v')}
function spawn(){const t=queue.shift(),D=DEF[t],s=Math.random()<.5?-1:1;
es.push({t:t,D:D,x:s<0?cam-40:cam+W+40,y:GY,face:-s,hp:D.hp*(mode==='wave'?1+wave*.04:1),max:D.hp*(mode==='wave'?1+wave*.04:1),state:'move',tm:0,stun:0,kv:0,dead:false,dt:0,anim:Math.random()*9,flash:0,bar:0,atk:null,moving:false,attackN:0})}
// ---------- combat
function fx(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=80+Math.random()*220;pt.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:.35,c:col||'#ffd36b'})}}
function txt(x,y,s,c){tx.push({x:x,y:y,s:s,c:c||'#ffc83d',l:.9})}
function hurtE(e,d,kb){if(e.dead)return;e.hp-=d;e.stun=e.D.sc>1.1?.12:.3;e.kv=p.face*kb;e.flash=.08;e.bar=2;
if(e.state==='wind'){e.state='cd';e.tm=.5}e.atk=null;combo++;comboT=2;score+=d+combo*2;
fx(e.x,e.y-80,9);txt(e.x,e.y-140,'-'+d);hs=.06;shake=Math.max(shake,kb>100?7:3);snd(kb>100?110:160,.12,'square',.09,-60);
if(e.hp<=0){e.dead=true;e.dt=0;kills++;score+=e.D.pts;shake=8;fx(e.x,e.y-70,16,'#ff7a5a');snd(80,.3,'sawtooth',.1,-40);
const r=Math.random();if(r<.35)pk.push({x:e.x,k:'a'});else if(r<.5)pk.push({x:e.x,k:'h'})}}
function hurtP(d,dir){if(p.inv>0||p.dead)return;p.hp-=d;p.inv=.35;p.stun=.25;p.kv=dir*180;p.atk=null;p.flash=.1;combo=0;shake=8;hs=.07;
fx(p.x,p.y-80,8,'#ff5a4a');txt(p.x,p.y-150,'-'+d,'#ff6a5a');snd(120,.15,'sawtooth',.1,-50);
if(p.hp<=0){p.hp=0;p.dead=true;p.dt=0;p.vy=-250;p.kv=dir*220;koT=0;snd(200,.8,'sawtooth',.1,-170)}}
function doAtk(a){
if(a.type==='gun'){p.ammo--;bs.push({x:p.x+p.face*SP.mz.x,y:p.y+SP.mz.y,vx:p.face*(p.upgraded?760:640),d:p.upgraded?70:20,own:1});shake=p.upgraded?5:2;snd(p.upgraded?360:520,p.upgraded?.2:.12,'square',p.upgraded?.1:.08,p.upgraded?520:-380);if(p.upgraded)fx(p.x+p.face*72,p.y-145,10,'#ff9c45');return}
const rg=a.type==='punch'?SP.reach.punch*.9:SP.reach.kick*.9,dm=a.type==='punch'?8:14,kb=a.type==='punch'?70:170;
let t=es.filter(e=>!e.dead&&(e.x-p.x)*p.face>-12&&(e.x-p.x)*p.face<rg&&Math.abs(e.y-p.y)<55);
if(!t.length){snd(260,.06,'triangle',.04,-120);return}
if(a.type==='punch'){t.sort((x,y)=>Math.abs(x.x-p.x)-Math.abs(y.x-p.x));t=[t[0]]}
t.forEach(e=>hurtE(e,dm,kb))}
function fireE(e){const D=e.D;
if(e.t==='x'){const n=e.attackN++%3,pose=n===2?'kick':n===0?'swingA':'swingB';e.atk={type:'punch',t:0,dur:pose==='kick'?.44:.38,pose};
if(Math.abs(p.x-e.x)<D.rg+(pose==='kick'?36:20)&&Math.abs(p.y-e.y)<55&&(p.x-e.x)*e.face>-12)hurtP(D.d+(pose==='kick'?5:0),e.face);
if(pose==='kick')shake=Math.max(shake,10);return}
if(D.rng){e.atk={type:'gun',t:0,dur:.3};bs.push({x:e.x+e.face*SE.mz.x*D.sc,y:e.y+SE.mz.y*D.sc,vx:e.face*320,d:D.d,own:0});snd(300,.12,'square',.05,-150)}
else{e.atk={type:'punch',t:0,dur:.25};if(Math.abs(p.x-e.x)<D.rg+16&&Math.abs(p.y-e.y)<55&&(p.x-e.x)*e.face>-12)hurtP(D.d,e.face)}}
// ---------- update
function updP(dt){
if(p.dead){p.vy+=1500*dt;p.y=Math.min(GY,p.y+p.vy*dt);if(p.y>=GY)p.vy=0;p.x+=p.kv*dt;p.kv*=Math.pow(.01,dt);p.dt+=dt;koT+=dt;if(koT>1.4)end(false);return}
p.inv-=dt;p.stun-=dt;p.flash-=dt;p.anim+=dt;p.x+=p.kv*dt;p.kv*=Math.pow(.0005,dt);
p.moving=false;
if(p.stun<=0){const dir=(keys.right?1:0)-(keys.left?1:0);p.x+=dir*(p.atk?60:155)*dt;if(dir&&!p.atk)p.face=dir;p.moving=dir!==0&&p.y>=GY;
if(press.jump&&p.y>=GY){p.vy=-600;snd(240,.15,'triangle',.05,300)}
if(!p.atk){let a=null;if(press.punch)a={type:'punch',dur:.26,hit:.08};else if(press.kick)a={type:'kick',dur:.42,hit:.16};else if(press.gun){if(p.ammo>0)a={type:'gun',dur:.3,hit:.1};else{txt(p.x,p.y-150,'NO AMMO','#fff');snd(90,.08)}}
if(a){a.t=0;a.done=false;p.atk=a;if(!(keys.left||keys.right)){let n=null,bd=150;es.forEach(e=>{const d=Math.abs(e.x-p.x);if(!e.dead&&d<bd){bd=d;n=e}});if(n)p.face=n.x>=p.x?1:-1}}}}
p.vy+=1600*dt;p.y+=p.vy*dt;if(p.y>=GY){p.y=GY;p.vy=0}
p.x=Math.max(20,Math.min(WW-20,p.x));
if(p.atk){p.atk.t+=dt;if(!p.atk.done&&p.atk.t>=p.atk.hit){p.atk.done=true;doAtk(p.atk)}if(p.atk.t>=p.atk.dur)p.atk=null}}
function updE(e,dt){const D=e.D;e.anim+=dt;e.flash-=dt;e.bar-=dt;
if(e.dead){e.dt+=dt;return}
e.x+=e.kv*dt;e.kv*=Math.pow(.001,dt);if(e.atk){e.atk.t+=dt;if(e.atk.t>=e.atk.dur)e.atk=null}
e.moving=false;if(e.stun>0){e.stun-=dt;return}
const dx=p.x-e.x,ad=Math.abs(dx);if(p.dead)return;e.face=dx>=0?1:-1;
const sp=D.sp*(mode==='wave'?1+wave*.02:1);
if(e.state==='wind'){e.tm-=dt;if(e.tm<=0){fireE(e);e.state='cd';e.tm=D.cd*(.8+Math.random()*.5)}}
else if(e.state==='cd'){e.tm-=dt;if(e.tm<=0)e.state='move'}
else if(D.rng){const cor=e.x<10||e.x>WW-10;if(ad<150&&!cor){e.x-=e.face*sp*dt;e.moving=true}else if(ad>230){e.x+=e.face*sp*dt;e.moving=true}else{e.state='wind';e.tm=D.w}}
else if(ad>D.rg-8){e.x+=e.face*sp*dt;e.moving=true}else{e.state='wind';e.tm=D.w}
e.x=Math.max(-60,Math.min(WW+60,e.x))}
function nextSwingAnchor(x){const i=Math.floor((x-80)/300)+1;return{x:i*300+80,y:-55-(i*37%45)}}
function swingBuildingAt(x,y){
for(let i=Math.floor((x-12)/260)-1;i<=Math.floor((x+12)/260)+1;i++){
const left=i*260,w=145+((i*31%65)+65)%65,top=140+((i*73%150)+150)%150;
if(x+12>left&&x-12<left+w&&Math.abs(y-top)<1.5)return top;
}
return null}
function swingBuildingLanding(x,fromY,toY){
if(toY<=fromY)return null;
for(let i=Math.floor((x-12)/260)-1;i<=Math.floor((x+12)/260)+1;i++){
const left=i*260,w=145+((i*31%65)+65)%65,top=140+((i*73%150)+150)%150;
if(x+12>left&&x-12<left+w&&fromY<=top&&toY>=top)return top;
}
return null}
function updateSwing(dt){
time+=dt;p.anim+=dt;p.face=1;p.moving=true;
if(press.jump){p.swingArmed=true;if(!p.swingAnchor){p.swingAnchor=nextSwingAnchor(p.x);p.swingRope=Math.max(175,Math.min(300,Math.hypot(p.x-p.swingAnchor.x,p.y-SWING_HOOK_Y-p.swingAnchor.y)))}}
if(p.swingAnchor&&p.swingArmed&&!keys.jump)p.swingAnchor=null;
if(press.punch){p.onBuilding=false;p.vx+=110;p.vy-=125;snd(420,.12,'triangle',.06,320)}
const dir=(keys.right?1:0)-(keys.left?1:0);
const prevY=p.y,wasOnBuilding=p.onBuilding;
if(p.onBuilding){
if(swingBuildingAt(p.x,p.y)===null)p.onBuilding=false;
else if(dir){p.vx=dir*205;p.x+=p.vx*dt;if(swingBuildingAt(p.x,p.y)===null)p.onBuilding=false}
else{p.vx=0;p.vy=0}
}
if(!p.onBuilding){
if(!wasOnBuilding||dir){p.vx+=dir*240*dt;p.vx=Math.max(-420,Math.min(420,p.vx))}
p.vx*=Math.pow(.995,dt*60);
p.vy+=760*dt;
if(!wasOnBuilding)p.x+=p.vx*dt;
p.y+=p.vy*dt;
}
